spring:
  datasource:
    url: ${DB_URL:jdbc:h2:mem:crew_handshake;DB_CLOSE_DELAY=-1}
    username: ${DB_USER:sa}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  servlet:
    session:
      cookie:
        secure: ${COOKIE_SECURE:false}
        same-site: Lax

app:
  public-base-url: ${PUBLIC_APP_BASE_URL:http://localhost:4200}
  sms-provider: ${SMS_PROVIDER:log}
  trusted-proxies: ${TRUSTED_PROXIES:}
  otp:
    phone-rate-limit-max: ${OTP_RATE_LIMIT_PHONE_MAX:5}
    phone-rate-limit-window: ${OTP_RATE_LIMIT_PHONE_WINDOW:PT15M}
    ip-rate-limit-max: ${OTP_RATE_LIMIT_IP_MAX:20}
    ip-rate-limit-window: ${OTP_RATE_LIMIT_IP_WINDOW:PT15M}
    attempt-retention: ${OTP_ATTEMPT_RETENTION:PT24H}
