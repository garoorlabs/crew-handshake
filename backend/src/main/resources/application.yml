spring:
  datasource:
    url: ${DB_URL:jdbc:h2:mem:crew_handshake;DB_CLOSE_DELAY=-1}
    username: ${DB_USER:sa}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  servlet:
    session:
      cookie:
        secure: ${COOKIE_SECURE:false}
        same-site: Lax

app:
  public-base-url: ${PUBLIC_APP_BASE_URL:http://localhost:4200}
  sms-provider: ${SMS_PROVIDER:log}
