<div class="ds-layout-admin">
  <a class="ds-skip-link" href="#main">Skip to content</a>
  <header class="shell">
    <div class="shell__inner">
      <div class="shell__top">
        <div class="shell__brand">Crew Handshake</div>
        <button
          class="ds-button ds-button--secondary shell__menu-toggle"
          type="button"
          (click)="toggleMenu()"
          aria-controls="admin-nav"
          [attr.aria-expanded]="menuOpen() ? 'true' : 'false'"
        >
          {{ menuOpen() ? 'Close menu' : 'Menu' }}
        </button>
      </div>
      <div class="shell__menu" [class.shell__menu--open]="menuOpen()">
        <nav id="admin-nav" class="shell__nav" aria-label="Admin">
          <a
            class="shell__link"
            routerLink="/a/workers"
            routerLinkActive="shell__link--active"
            (click)="closeMenu()"
            >Workers</a
          >
          <a
            class="shell__link"
            routerLink="/a/foremen"
            routerLinkActive="shell__link--active"
            (click)="closeMenu()"
            >Foremen</a
          >
          <a
            class="shell__link"
            routerLink="/a/crews"
            routerLinkActive="shell__link--active"
            (click)="closeMenu()"
            >Crews</a
          >
          <a
            class="shell__link"
            routerLink="/a/sites"
            routerLinkActive="shell__link--active"
            (click)="closeMenu()"
            >Sites</a
          >
          <a
            class="shell__link"
            routerLink="/a/settings"
            routerLinkActive="shell__link--active"
            (click)="closeMenu()"
            >Settings</a
          >
          <a
            class="shell__link"
            routerLink="/a/exceptions"
            routerLinkActive="shell__link--active"
            (click)="closeMenu()"
            >Exceptions</a
          >
          <a
            class="shell__link"
            routerLink="/a/payroll"
            routerLinkActive="shell__link--active"
            (click)="closeMenu()"
            >Payroll</a
          >
          <a
            class="shell__link"
            routerLink="/a/audit"
            routerLinkActive="shell__link--active"
            (click)="closeMenu()"
            >Audit</a
          >
        </nav>
        <div class="shell__spacer"></div>
        <div class="shell__actions">
          <button
            class="ds-button ds-button--ghost"
            type="button"
            (click)="logout()"
            [disabled]="isLoggingOut"
          >
            Log out
          </button>
        </div>
      </div>
    </div>
  </header>
  <div class="ds-page">
    <main id="main" class="ds-page__content" role="main">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
