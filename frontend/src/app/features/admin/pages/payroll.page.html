<app-page-header title="Payroll" subtitle="Review readiness and export CSV.">
  <button
    class="ds-button ds-button--secondary"
    type="button"
    (click)="load()"
    [disabled]="loading()"
  >
    Refresh
  </button>
</app-page-header>

<section class="ds-stack">
  @if (error()) {
    <div class="ds-alert ds-alert--error" role="status" aria-live="polite">
      {{ error()?.message }}
    </div>
  }

  @if (loading()) {
    <div class="loading-wrap">
      <app-loading-spinner label="Loading payroll summary"></app-loading-spinner>
    </div>
  } @else {
    @if (!summary()) {
      <div class="ds-card">
        <p class="ds-page-subtitle">No payroll data available yet.</p>
      </div>
    } @else {
      <div class="ds-card summary-card">
        <div class="summary-row">
          <div>
            <div class="summary-label">Period</div>
            <div class="summary-value">
              {{ summary()?.periodStart }} to {{ summary()?.periodEnd }}
            </div>
          </div>
          <div>
            <div class="summary-label">Entries</div>
            <div class="summary-value">{{ summary()?.totalEntries }}</div>
          </div>
          <div>
            <div class="summary-label">Open exceptions</div>
            <div class="summary-value">{{ summary()?.unresolvedExceptions }}</div>
          </div>
        </div>
        <button
          class="ds-button ds-button--primary"
          type="button"
          (click)="onExport()"
          [disabled]="exporting()"
        >
          {{ exporting() ? 'Exporting...' : 'Export CSV' }}
        </button>
      </div>
    }
  }
</section>
